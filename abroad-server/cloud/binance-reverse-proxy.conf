map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;

  server_name _;

  # Resolve upstream hosts at request time so Binance DNS rotations do not
  # require a proxy restart. This is the DNS resolver supplied to GCE VMs.
  resolver 169.254.169.254 valid=60s ipv6=off;
  resolver_timeout 5s;

  # REST API
  location / {
    set $binance_rest_host api.binance.com;
    proxy_pass https://$binance_rest_host;

    proxy_ssl_server_name on;
    proxy_ssl_name $binance_rest_host;
    proxy_set_header Host $binance_rest_host;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # WebSocket API. The Binance SDK supplies the /ws-api/v3 request URI.
  location /ws-api/ {
    set $binance_ws_api_host ws-api.binance.com;
    proxy_pass https://$binance_ws_api_host:443;

    proxy_ssl_server_name on;
    proxy_ssl_name $binance_ws_api_host;
    proxy_set_header Host $binance_ws_api_host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 60s;
    proxy_buffering off;
  }

  # WebSocket streams
  location /ws/ {
    set $binance_stream_host stream.binance.com;
    proxy_pass https://$binance_stream_host:9443;

    proxy_ssl_server_name on;
    proxy_ssl_name $binance_stream_host;
    proxy_set_header Host $binance_stream_host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 60s;
    proxy_buffering off;
  }

  # Multiplexed WebSocket streams
  location /stream {
    set $binance_stream_host stream.binance.com;
    proxy_pass https://$binance_stream_host:9443;

    proxy_ssl_server_name on;
    proxy_ssl_name $binance_stream_host;
    proxy_set_header Host $binance_stream_host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 60s;
    proxy_buffering off;
  }

  error_log /var/log/nginx/binance-proxy-error.log;
  access_log /var/log/nginx/binance-proxy-access.log;
}
